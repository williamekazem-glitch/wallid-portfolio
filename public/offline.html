<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0B10">
<title>Pas de connexion — Wallid</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(ellipse at 80% 0%, rgba(245,158,11,.22), transparent 60%), #0B0B10;
    color: #F8FAFC; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 420px; width: 100%; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 50%; border: 2px solid #F59E0B; object-fit: cover; }
  h1 { font-size: 1.7rem; margin: 20px 0 10px; letter-spacing: -.02em; }
  p { color: rgba(248,250,252,.75); line-height: 1.55; }
  .actions { display: grid; gap: 12px; margin-top: 28px; }
  a, button {
    display: flex; align-items: center; justify-content: center; min-height: 54px;
    border-radius: 14px; font-family: inherit; font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer; border: 0; width: 100%;
  }
  .call { background: #F59E0B; color: #0B0B10; }
  .retry { background: rgba(255,255,255,.06); color: #F8FAFC; border: 1px solid rgba(255,255,255,.14); }
  small { display: block; margin-top: 18px; color: rgba(248,250,252,.5); font-size: 13px; }
</style>
</head>
<body>
<main>
  <img src="/wallid-avatar.jpg" alt="" width="88" height="88">
  <h1>Pas de connexion internet</h1>
  <p>Cette page n'a pas pu se charger. Vous pouvez quand même nous joindre : un appel fonctionne sans internet.</p>
  <div class="actions">
    <a class="call" href="tel:+2250710111118">Appeler le +225 07 10 11 11 18</a>
    <button class="retry" type="button" onclick="location.reload()">Réessayer</button>
  </div>
  <small>La page se rechargera dès que la connexion revient.</small>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
